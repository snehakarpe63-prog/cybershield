<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tabs button {
            flex: 1;
            border-radius: 0;
        }

        .tabs button:first-child {
            border-radius: 8px 0 0 8px;
        }

        .tabs button:last-child {
            border-radius: 0 8px 8px 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .logout-button {
            background: #7f1d1d;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .scan-row {
            display: flex;
            gap: 10px;
        }

        .scan-row input {
            margin-bottom: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            color: #64748b;
            font-size: 14px;
        }

        .value {
            font-size: 25px;
            font-weight: bold;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .result-item {
            padding: 18px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
        }

        .result-item strong {
            display: block;
            margin-bottom: 8px;
        }

        .history-item {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
            background: #f8fafc;
        }

        .history-item strong {
            display: block;
            margin-bottom: 8px;
        }

        .good {
            color: #166534;
            font-weight: bold;
        }

        .warning {
            color: #92400e;
            font-weight: bold;
        }

        .bad {
            color: #991b1b;
            font-weight: bold;
        }

        .info {
            color: #1d4ed8;
            font-weight: bold;
        }

        .empty {
            color: #64748b;
        }

        .hidden {
            display: none;
        }

        .finding {
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
        }

        .limitation {
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-button {
            margin-top: 10px;
        }

        @media (max-width: 850px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }

            .user-area {
                flex-direction: column;
                align-items: flex-end;
            }

            .scan-row {
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOGIN / REGISTER
    ========================== -->

    <div id="authPage" class="auth-container">

        <div class="card">

            <h1>CyberShield</h1>

            <p>
                Defensive Website Security Analysis
            </p>

            <div class="tabs">

                <button onclick="showRegister()">
                    Register
                </button>

                <button onclick="showLogin()">
                    Login
                </button>

            </div>


            <!-- Login -->

            <div id="loginForm">

                <h2>Login</h2>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                >

                <button onclick="loginUser()">
                    Login
                </button>

                <div
                    id="loginMessage"
                    class="message"
                ></div>

            </div>


            <!-- Register -->

            <div id="registerForm" class="hidden">

                <h2>Create Account</h2>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Full name"
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password (minimum 8 characters)"
                >

                <button onclick="registerUser()">
                    Create Account
                </button>

                <div
                    id="registerMessage"
                    class="message"
                ></div>

            </div>

        </div>

    </div>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <div id="dashboard" class="hidden">

        <div class="navbar">

            <div>
                <h1>CyberShield</h1>
            </div>

            <div class="user-area">

                <span id="welcomeUser"></span>

                <button
                    class="logout-button"
                    onclick="logoutUser()"
                >
                    Logout
                </button>

            </div>

        </div>


        <div class="container">

            <!-- New Scan -->

            <div class="card">

                <h2>New Security Scan</h2>

                <p>
                    Enter a domain that you own or are authorized to analyze.
                </p>

                <div class="scan-row">

                    <input
                        type="text"
                        id="domain"
                        placeholder="example.com"
                    >

                    <button onclick="scanDomain()">
                        Start Scan
                    </button>

                </div>

                <div
                    id="scanMessage"
                    class="message"
                ></div>

            </div>


            <!-- Statistics -->

            <div class="stats">

                <div class="stat-card">

                    <h3>Risk Score</h3>

                    <div
                        id="score"
                        class="value"
                    >
                        --
                    </div>

                </div>


                <div class="stat-card">

                    <h3>Risk Level</h3>

                    <div
                        id="risk"
                        class="value"
                    >
                        --
                    </div>

                </div>


                <div class="stat-card">

                    <h3>HTTPS</h3>

                    <div
                        id="https"
                        class="value"
                    >
                        --
                    </div>

                </div>


                <div class="stat-card">

                    <h3>SSL/TLS</h3>

                    <div
                        id="ssl"
                        class="value"
                    >
                        --
                    </div>

                </div>

            </div>


            <!-- Current Scan -->

            <div class="card">

                <h2>Current Scan Details</h2>

                <div id="result">

                    <p class="empty">
                        No scan performed yet.
                    </p>

                </div>

            </div>


            <!-- Scan History -->

            <div class="card">

                <div class="header-row">

                    <h2>My Scan History</h2>

                    <button
                        class="refresh-button"
                        onclick="loadHistory()"
                    >
                        Refresh History
                    </button>

                </div>

                <div id="history"></div>

            </div>

        </div>

    </div>


<script>

/* =========================
   AUTH UI
========================= */

function showRegister() {

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    document
        .getElementById("loginForm")
        .classList.add("hidden");
}


function showLogin() {

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("registerForm")
        .classList.add("hidden");
}


/* =========================
   REGISTER
========================= */

async function registerUser() {

    const name =
        document.getElementById("registerName")
            .value.trim();

    const email =
        document.getElementById("registerEmail")
            .value.trim();

    const password =
        document.getElementById("registerPassword")
            .value;

    const message =
        document.getElementById("registerMessage");


    message.textContent = "Registering...";


    try {

        const response = await fetch(
            "/api/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    email,
                    password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            message.textContent =
                data.error || "Registration failed.";

            return;
        }


        message.textContent =
            "Registration successful. Please login.";

        document.getElementById(
            "registerPassword"
        ).value = "";

        showLogin();

    } catch (error) {

        message.textContent =
            "Could not connect to the server.";

        console.error(error);
    }
}


/* =========================
   LOGIN
========================= */

async function loginUser() {

    const email =
        document.getElementById("loginEmail")
            .value.trim();

    const password =
        document.getElementById("loginPassword")
            .value;

    const message =
        document.getElementById("loginMessage");


    message.textContent = "Logging in...";


    try {

        const response = await fetch(
            "/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            message.textContent =
                data.error || "Login failed.";

            return;
        }


        showDashboard(data.user);

    } catch (error) {

        message.textContent =
            "Could not connect to the server.";

        console.error(error);
    }
}


/* =========================
   DASHBOARD
========================= */

function showDashboard(user) {

    document
        .getElementById("authPage")
        .classList.add("hidden");

    document
        .getElementById("dashboard")
        .classList.remove("hidden");

    document
        .getElementById("welcomeUser")
        .textContent =
            `Welcome, ${user.name}`;

    loadHistory();
}


/* =========================
   LOGOUT
========================= */

async function logoutUser() {

    try {

        await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.error(error);
    }


    document
        .getElementById("dashboard")
        .classList.add("hidden");

    document
        .getElementById("authPage")
        .classList.remove("hidden");

    showLogin();
}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

    try {

        const response =
            await fetch("/api/me");

        const data =
            await response.json();


        if (data.logged_in) {

            showDashboard(data.user);

        } else {

            document
                .getElementById("authPage")
                .classList.remove("hidden");
        }

    } catch (error) {

        console.error(error);
    }
}


/* =========================
   SCAN DOMAIN
========================= */

async function scanDomain() {

    const domain =
        document.getElementById("domain")
            .value.trim();

    const message =
        document.getElementById("scanMessage");

    const result =
        document.getElementById("result");


    if (!domain) {

        message.textContent =
            "Please enter a domain.";

        return;
    }


    message.textContent =
        "Scanning...";

    result.innerHTML = `
        <p class="empty">
            CyberShield is analyzing the domain...
        </p>
    `;


    try {

        const response = await fetch(
            "/api/scan",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    domain
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            message.textContent =
                data.error ||
                "Scan failed.";

            return;
        }


        if (!data.result) {

            message.textContent =
                "The server did not return a scan result.";

            return;
        }


        const scan =
            data.result;


        message.textContent =
            "Scan completed successfully.";


        /* Dashboard cards */

        document.getElementById(
            "score"
        ).textContent =
            scan.risk.score;


        document.getElementById(
            "risk"
        ).textContent =
            scan.risk.level;


        const httpsReachable =
            scan.http &&
            scan.http.https &&
            scan.http.https.reachable;


        document.getElementById(
            "https"
        ).textContent =
            httpsReachable
                ? "Yes"
                : "Unable to verify";


        const tlsVerified =
            scan.ssl &&
            scan.ssl.valid_connection;


        document.getElementById(
            "ssl"
        ).textContent =
            tlsVerified
                ? "Valid"
                : "Unable to verify";


        /* HTTP */

        const httpStatus =
            scan.http &&
            scan.http.https
                ? scan.http.https.status_code
                : null;


        const finalUrl =
            scan.http &&
            scan.http.https
                ? scan.http.https.final_url
                : null;


        /* DNS */

        const ipv4 =
            scan.dns &&
            scan.dns.ipv4_addresses
                ? scan.dns.ipv4_addresses
                : [];


        /* Headers */

        const headers =
            scan.http &&
            scan.http.security_headers
                ? scan.http.security_headers
                : {};


        /* Current result */

        let html = `

            <div class="result-grid">

                <div class="result-item">

                    <strong>Domain</strong>

                    ${escapeHtml(scan.domain)}

                </div>


                <div class="result-item">

                    <strong>Risk Score</strong>

                    ${escapeHtml(
                        String(scan.risk.score)
                    )}

                </div>


                <div class="result-item">

                    <strong>Risk Level</strong>

                    ${escapeHtml(
                        scan.risk.level
                    )}

                </div>


                <div class="result-item">

                    <strong>HTTPS Status</strong>

                    ${
                        httpsReachable
                            ? '<span class="good">Reachable</span>'
                            : '<span class="info">Unable to verify</span>'
                    }

                </div>


                <div class="result-item">

                    <strong>HTTP Status</strong>

                    ${
                        httpStatus !== null
                            ? escapeHtml(
                                String(httpStatus)
                              )
                            : "Not available"
                    }

                </div>


                <div class="result-item">

                    <strong>Final URL</strong>

                    ${
                        finalUrl
                            ? escapeHtml(finalUrl)
                            : "Not available"
                    }

                </div>


                <div class="result-item">

                    <strong>IPv4 Addresses</strong>

                    ${
                        ipv4.length > 0
                            ? escapeHtml(
                                ipv4.join(", ")
                              )
                            : "Not found"
                    }

                </div>


                <div class="result-item">

                    <strong>TLS Status</strong>

                    ${
                        tlsVerified
                            ? '<span class="good">Verified</span>'
                            : '<span class="info">Unable to verify</span>'
                    }

                </div>

            </div>
        `;


        /* TLS details */

        html += `

            <div
                class="result-item"
                style="margin-top: 15px;"
            >

                <strong>
                    TLS Certificate
                </strong>

                <p>
                    Status:
                    ${
                        scan.ssl.status
                            ? escapeHtml(
                                scan.ssl.status
                              )
                            : "Not available"
                    }
                </p>

                <p>
                    Issuer:
                    ${
                        scan.ssl.issuer
                            ? escapeHtml(
                                scan.ssl.issuer
                              )
                            : "Not available"
                    }
                </p>

                <p>
                    Subject:
                    ${
                        scan.ssl.subject
                            ? escapeHtml(
                                scan.ssl.subject
                              )
                            : "Not available"
                    }
                </p>

                <p>
                    Expires:
                    ${
                        scan.ssl.expires_at
                            ? escapeHtml(
                                scan.ssl.expires_at
                              )
                            : "Not available"
                    }
                </p>

                <p>
                    Days Until Expiry:
                    ${
                        scan.ssl.days_until_expiry !== null
                            ? escapeHtml(
                                String(
                                    scan.ssl.days_until_expiry
                                )
                              )
                            : "Not available"
                    }
                </p>

            </div>
        `;


        /* Security headers */

        html += `

            <div
                class="result-item"
                style="margin-top: 15px;"
            >

                <strong>
                    Security Headers
                </strong>

                ${headerStatus(
                    "Strict-Transport-Security",
                    headers
                )}

                ${headerStatus(
                    "Content-Security-Policy",
                    headers
                )}

                ${headerStatus(
                    "X-Content-Type-Options",
                    headers
                )}

                ${headerStatus(
                    "X-Frame-Options",
                    headers
                )}

                ${headerStatus(
                    "Referrer-Policy",
                    headers
                )}

                ${headerStatus(
                    "Permissions-Policy",
                    headers
                )}

            </div>
        `;


        /* Findings */

        html += `

            <div
                class="result-item"
                style="margin-top: 15px;"
            >

                <strong>
                    Security Findings
                </strong>

        `;


        if (
            scan.risk.findings &&
            scan.risk.findings.length > 0
        ) {

            html += scan.risk.findings
                .map(
                    finding => `
                        <div class="finding">
                            ${escapeHtml(finding)}
                        </div>
                    `
                )
                .join("");

        } else {

            html += `
                <p class="good">
                    No confirmed findings were reported
                    by the current checks.
                </p>
            `;
        }


        html += `
            </div>
        `;


        /* Limitations */

        html += `

            <div
                class="result-item"
                style="margin-top: 15px;"
            >

                <strong>
                    Analysis Limitations
                </strong>

        `;


        if (
            scan.risk.limitations &&
            scan.risk.limitations.length > 0
        ) {

            html += scan.risk.limitations
                .map(
                    limitation => `
                        <div class="limitation">
                            ${escapeHtml(limitation)}
                        </div>
                    `
                )
                .join("");

        } else {

            html += `
                <p class="good">
                    No analysis limitations were reported.
                </p>
            `;
        }


        html += `
            </div>
        `;


        result.innerHTML = html;


        /* Update history */

        await loadHistory();

    } catch (error) {

        console.error(
            "Scan frontend error:",
            error
        );

        message.textContent =
            "The scan response could not be displayed.";

    }
}


/* =========================
   HEADER STATUS
========================= */

function headerStatus(name, headers) {

    const present =
        headers &&
        headers[name] === true;


    return `
        <p class="${
            present
                ? "good"
                : "warning"
        }">

            ${escapeHtml(name)}:

            ${
                present
                    ? "Present"
                    : "Missing"
            }

        </p>
    `;
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   SCAN HISTORY
========================= */

async function loadHistory() {

    const history =
        document.getElementById("history");


    history.innerHTML = `
        <p class="empty">
            Loading scan history...
        </p>
    `;


    try {

        const response =
            await fetch("/api/scans");


        const data =
            await response.json();


        if (!response.ok) {

            history.innerHTML = `
                <p class="empty">
                    ${
                        data.error ||
                        "Could not load scan history."
                    }
                </p>
            `;

            return;
        }


        if (
            !data.scans ||
            data.scans.length === 0
        ) {

            history.innerHTML = `
                <p class="empty">
                    No scans found.
                </p>
            `;

            return;
        }


        history.innerHTML =
            data.scans
                .map(
                    scan => `
                        <div class="history-item">

                            <strong>
                                ${escapeHtml(
                                    scan.domain
                                )}
                            </strong>

                            <div>
                                Risk Score:
                                ${escapeHtml(
                                    String(
                                        scan.risk_score
                                    )
                                )}
                            </div>

                            <div>
                                Risk Level:
                                ${escapeHtml(
                                    scan.risk_level
                                )}
                            </div>

                            <div>
                                Scanned At:
                                ${escapeHtml(
                                    scan.scanned_at
                                )}
                            </div>

                        </div>
                    `
                )
                .join("");

    } catch (error) {

        console.error(
            "History error:",
            error
        );

        history.innerHTML = `
            <p class="empty">
                Could not load scan history.
            </p>
        `;
    }
}


/* =========================
   START
========================= */

checkLogin();

</script>

</body>

</html>
