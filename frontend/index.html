<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .auth-container {
            max-width: 450px;
            margin: 60px auto;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tabs button {
            flex: 1;
            border-radius: 0;
        }

        .tabs button:first-child {
            border-radius: 8px 0 0 8px;
        }

        .tabs button:last-child {
            border-radius: 0 8px 8px 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .logout-button {
            background: #7f1d1d;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .scan-row {
            display: flex;
            gap: 10px;
        }

        .scan-row input {
            margin-bottom: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            color: #64748b;
        }

        .value {
            font-size: 25px;
            font-weight: bold;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .result-item,
        .history-item {
            padding: 18px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
        }

        .history-item {
            margin-top: 12px;
        }

        .history-item strong,
        .result-item strong {
            display: block;
            margin-bottom: 8px;
        }

        .good {
            color: #166534;
            font-weight: bold;
        }

        .warning {
            color: #92400e;
            font-weight: bold;
        }

        .empty {
            color: #64748b;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .navbar {
                padding: 15px 20px;
            }
        }

        @media (max-width: 600px) {
            .stats,
            .result-grid {
                grid-template-columns: 1fr;
            }

            .scan-row {
                flex-direction: column;
            }

            .user-area {
                flex-direction: column;
                align-items: flex-end;
            }
        }
    </style>
</head>

<body>

    <!-- Authentication -->
    <div id="authPage" class="auth-container">

        <div class="card">

            <h1>CyberShield</h1>

            <p>
                Defensive Website Security Analysis
            </p>

            <div class="tabs">

                <button onclick="showRegister()">
                    Register
                </button>

                <button onclick="showLogin()">
                    Login
                </button>

            </div>


            <!-- Login -->

            <div id="loginForm">

                <h2>Login</h2>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                >

                <button onclick="loginUser()">
                    Login
                </button>

                <div
                    id="loginMessage"
                    class="message"
                ></div>

            </div>


            <!-- Register -->

            <div id="registerForm" class="hidden">

                <h2>Create Account</h2>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Full name"
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password (minimum 8 characters)"
                >

                <button onclick="registerUser()">
                    Create Account
                </button>

                <div
                    id="registerMessage"
                    class="message"
                ></div>

            </div>

        </div>

    </div>


    <!-- Dashboard -->

    <div id="dashboard" class="hidden">

        <div class="navbar">

            <div>
                <h1>CyberShield</h1>
            </div>

            <div class="user-area">

                <span id="welcomeUser"></span>

                <button
                    class="logout-button"
                    onclick="logoutUser()"
                >
                    Logout
                </button>

            </div>

        </div>


        <div class="container">

            <!-- Scan -->

            <div class="card">

                <h2>New Security Scan</h2>

                <p>
                    Enter a domain that you own or are authorized to analyze.
                </p>

                <div class="scan-row">

                    <input
                        type="text"
                        id="domain"
                        placeholder="example.com"
                    >

                    <button onclick="scanDomain()">
                        Start Scan
                    </button>

                </div>

                <div
                    id="scanMessage"
                    class="message"
                ></div>

            </div>


            <!-- Stats -->

            <div class="stats">

                <div class="stat-card">
                    <h3>Risk Score</h3>
                    <div id="score" class="value">--</div>
                </div>

                <div class="stat-card">
                    <h3>Risk Level</h3>
                    <div id="risk" class="value">--</div>
                </div>

                <div class="stat-card">
                    <h3>HTTPS</h3>
                    <div id="https" class="value">--</div>
                </div>

                <div class="stat-card">
                    <h3>SSL/TLS</h3>
                    <div id="ssl" class="value">--</div>
                </div>

            </div>


            <!-- Result -->

            <div class="card">

                <h2>Current Scan Details</h2>

                <div id="result">

                    <p class="empty">
                        No scan performed yet.
                    </p>

                </div>

            </div>


            <!-- History -->

            <div class="card">

                <h2>My Scan History</h2>

                <button onclick="loadHistory()">
                    Refresh History
                </button>

                <div id="history"></div>

            </div>

        </div>

    </div>


<script>

function showRegister() {

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    document
        .getElementById("loginForm")
        .classList.add("hidden");
}


function showLogin() {

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("registerForm")
        .classList.add("hidden");
}


async function registerUser() {

    const name =
        document.getElementById("registerName").value.trim();

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const message =
        document.getElementById("registerMessage");


    try {

        const response = await fetch(
            "/api/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    email,
                    password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            message.textContent = data.error;

            return;
        }


        message.textContent =
            "Registration successful. Please login.";

        showLogin();

    } catch (error) {

        message.textContent =
            "Could not connect to the server.";

    }
}


async function loginUser() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    try {

        const response = await fetch(
            "/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            message.textContent = data.error;

            return;
        }


        showDashboard(data.user);

    } catch (error) {

        message.textContent =
            "Could not connect to the server.";

    }
}


function showDashboard(user) {

    document
        .getElementById("authPage")
        .classList.add("hidden");


    document
        .getElementById("dashboard")
        .classList.remove("hidden");


    document
        .getElementById("welcomeUser")
        .textContent =
            `Welcome, ${user.name}`;


    loadHistory();
}


async function logoutUser() {

    await fetch(
        "/api/logout",
        {
            method: "POST"
        }
    );


    document
        .getElementById("dashboard")
        .classList.add("hidden");


    document
        .getElementById("authPage")
        .classList.remove("hidden");


    showLogin();

}


async function checkLogin() {

    try {

        const response =
            await fetch("/api/me");

        const data =
            await response.json();


        if (data.logged_in) {

            showDashboard(data.user);

        } else {

            document
                .getElementById("authPage")
                .classList.remove("hidden");

        }

    } catch (error) {

        console.error(error);

    }

}


async function scanDomain() {

    const domain =
        document.getElementById("domain").value.trim();

    const message =
        document.getElementById("scanMessage");


    if (!domain) {

        message.textContent =
            "Please enter a domain.";

        return;
    }


    message.textContent = "Scanning...";


    try {

        const response = await fetch(
            "/api/scan",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    domain
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            message.textContent =
                data.error;

            return;
        }


        message.textContent =
            "Scan completed successfully.";


        const scan = data.result;


        document.getElementById("score").textContent =
            scan.risk.score;

        document.getElementById("risk").textContent =
            scan.risk.level;

        document.getElementById("https").textContent =
            scan.http.https_available
                ? "Yes"
                : "No";

        document.getElementById("ssl").textContent =
            scan.ssl.valid_connection
                ? "Valid"
                : "Not verified";


        const headers =
            scan.http.security_headers;


        document.getElementById("result").innerHTML = `

            <div class="result-grid">

                <div class="result-item">
                    <strong>Domain</strong>
                    ${scan.domain}
                </div>

                <div class="result-item">
                    <strong>HTTP Status</strong>
                    ${scan.http.status_code ?? "Not available"}
                </div>

                <div class="result-item">
                    <strong>Final URL</strong>
                    ${scan.http.final_url || "Not available"}
                </div>

                <div class="result-item">
                    <strong>IPv4 Addresses</strong>
                    ${
                        scan.dns.ipv4_addresses.length
                            ? scan.dns.ipv4_addresses.join(", ")
                            : "Not found"
                    }
                </div>

                <div class="result-item">

                    <strong>Security Headers</strong>

                    <p class="${
                        headers["Strict-Transport-Security"]
                            ? "good"
                            : "warning"
                    }">

                        Strict-Transport-Security:
                        ${
                            headers["Strict-Transport-Security"]
                                ? "Present"
                                : "Missing"
                        }

                    </p>

                    <p class="${
                        headers["Content-Security-Policy"]
                            ? "good"
                            : "warning"
                    }">

                        Content-Security-Policy:
                        ${
                            headers["Content-Security-Policy"]
                                ? "Present"
                                : "Missing"
                        }

                    </p>

                    <p class="${
                        headers["X-Content-Type-Options"]
                            ? "good"
                            : "warning"
                    }">

                        X-Content-Type-Options:
                        ${
                            headers["X-Content-Type-Options"]
                                ? "Present"
                                : "Missing"
                        }

                    </p>

                    <p class="${
                        headers["X-Frame-Options"]
                            ? "good"
                            : "warning"
                    }">

                        X-Frame-Options:
                        ${
                            headers["X-Frame-Options"]
                                ? "Present"
                                : "Missing"
                        }

                    </p>

                    <p class="${
                        headers["Referrer-Policy"]
                            ? "good"
                            : "warning"
                    }">

                        Referrer-Policy:
                        ${
                            headers["Referrer-Policy"]
                                ? "Present"
                                : "Missing"
                        }

                    </p>

                    <p class="${
                        headers["Permissions-Policy"]
                            ? "good"
                            : "warning"
                    }">

                        Permissions-Policy:
                        ${
                            headers["Permissions-Policy"]
                                ? "Present"
                                : "Missing"
                        }

                    </p>

                </div>

                <div class="result-item">

                    <strong>Risk Reasons</strong>

                    ${
                        scan.risk.reasons.length
                            ? scan.risk.reasons
                                .map(reason => `<p>• ${reason}</p>`)
                                .join("")
                            : "<p>No risk reasons reported.</p>"
                    }

                </div>

            </div>
        `;


        loadHistory();

    } catch (error) {

        message.textContent =
            "Could not connect to the server.";

    }
}


async function loadHistory() {

    const history =
        document.getElementById("history");


    try {

        const response =
            await fetch("/api/scans");


        const data =
            await response.json();


        if (!response.ok) {

            history.innerHTML =
                `<p class="empty">${data.error}</p>`;

            return;
        }


        if (!data.scans.length) {

            history.innerHTML =
                `<p class="empty">
                    No scans found.
                 </p>`;

            return;
        }


        history.innerHTML =
            data.scans.map(scan => `

                <div class="history-item">

                    <strong>
                        ${scan.domain}
                    </strong>

                    <div>
                        Risk Score: ${scan.risk_score}
                    </div>

                    <div>
                        Risk Level: ${scan.risk_level}
                    </div>

                    <div>
                        Scanned At: ${scan.scanned_at}
                    </div>

                </div>

            `).join("");


    } catch (error) {

        history.innerHTML =
            `<p class="empty">
                Could not load scan history.
             </p>`;

    }

}


checkLogin();

</script>

</body>

</html>
